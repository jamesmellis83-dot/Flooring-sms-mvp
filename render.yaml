services:
  - type: web
    name: flooring-sms-mvp
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - { key: TWILIO_ACCOUNT_SID, sync: false }
      - { key: TWILIO_AUTH_TOKEN,  sync: false }
      - { key: TWILIO_PHONE_NUMBER,sync: false }
      - { key: OPENAI_API_KEY,     sync: false }
      - { key: ADMIN_USER,         sync: false }
      - { key: ADMIN_PASS,         sync: false }
      - { key: APP_URL,            sync: false }
